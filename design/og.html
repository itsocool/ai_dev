<!doctype html><html lang="ko"><head><meta charset="utf-8">
<script>
  // Pull in the site is own built stylesheet so this card always uses the current
  // tokens and typeface, whatever the content hash happens to be.
  const r = new XMLHttpRequest();
  r.open("GET", "/index.html", false); r.send();
  document.write('<link rel="stylesheet" href="' + r.responseText.match(/\/_next\/static\/[^"]*\.css/)[0] + '">');
</script>
<style>
  html,body{margin:0;padding:0}
  body{width:1200px;height:630px;overflow:hidden;background:var(--color-paper);color:var(--color-ink);
       font-family:var(--font-sans);-webkit-font-smoothing:antialiased}
  .card{position:relative;width:1200px;height:630px;display:grid;grid-template-columns:1fr 360px;
        gap:56px;padding:64px 72px;box-sizing:border-box}
  h1{margin:0;font-size:88px;font-weight:800;line-height:.98;letter-spacing:-.075em}
  .foot{position:absolute;left:72px;right:72px;bottom:56px;display:flex;justify-content:space-between;
        align-items:flex-end;border-top:1px solid var(--color-line);padding-top:20px;font-size:22px}
  .foot b{font-weight:700}
  .foot span{font-weight:500}
  .art{position:relative}
  .rule{position:absolute;background:var(--color-line)}
  .blk{position:absolute;background:var(--color-signal)}
  .dot{position:absolute;width:9px;height:9px;background:var(--color-ink)}
  .arc{position:absolute;border-top:1px solid var(--color-line);border-right:1px solid var(--color-line);
       border-radius:0 100% 0 0}
</style></head><body>
<div class="card">
  <div>
    <h1>AI를 실제<br>제품으로 만드는<br>개발자</h1>
  </div>
  <div class="art">
    <div class="rule" style="left:50%;top:0;width:1px;height:330px"></div>
    <div class="rule" style="left:0;top:96px;width:100%;height:1px"></div>
    <div class="dot" style="left:calc(50% - 4.5px);top:91.5px"></div>
    <div class="blk" style="left:56%;top:40px;width:104px;height:104px"></div>
    <div class="arc" style="right:8px;top:180px;width:132px;height:132px"></div>
    <div class="dot-grid" style="position:absolute;left:6px;top:210px;width:150px;height:104px"></div>
    <div class="blk" style="right:8px;top:322px;width:170px;height:22px"></div>
  </div>
  <div class="foot">
    <b>김태현 · AI Product Engineer</b>
    <span>dev.itsocool.tech</span>
  </div>
</div>
</body></html>
